; PlatformIO Project Configuration File for Fleet GPS Tracker
;
; This configuration is ready to build and flash to ESP32
; Update upload_port when hardware is connected

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DUSE_MOCK_GPS=1        ; Enable mock mode by default (set to 0 when hardware ready)
    -DLOG_LEVEL=3           ; 0=OFF, 1=ERROR, 2=WARN, 3=INFO, 4=DEBUG, 5=VERBOSE

; Library dependencies
lib_deps =
    TinyGPSPlus@^1.0.3      ; GPS parsing library
    ; BluetoothSerial is built-in to ESP32, no external library needed

; Upload settings (update when hardware ready)
; upload_port = /dev/ttyUSB0
; upload_speed = 115200

; Test configuration
test_build_project_src = true
test_framework = unity
test_filter = *

; Debugging settings
debug_tool = esp-prog
debug_init_break = tbreak setup
